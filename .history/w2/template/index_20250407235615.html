<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pizza Delivery Dashboard</title>

    <!-- Load CSS libraries -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ********************** 请在<body>内补充html代码 *********************** -->
    <!-- Make sure to include a div-container with the id: 'chart-area' -->
    <div class="container">
        <div class="row">
            <div class="col-sm-10">
                <table class='table-logo'>
                    <td>
                        <h1>Pizza Delivery Dashboard</h1>
                    </td>

                    <td>
                        <img src="img/PizzaWorld-Logo.png" id="logo" alt="Pizza-World-Logo" />
                    </td>
                </table>
            </div>

        </div>

        <!-- Summary Statistics -->
        <div class="row stats-container">
            <div class="col-sm-3">
                <div class="stat-box">
                    <h4>配送次数</h4>
                    <p id="delivery-count"></p>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="stat-box">
                    <h4>披萨总数</h4>
                    <p id="pizza-count"></p>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="stat-box">
                    <h4>平均配送时间</h4>
                    <p id="avg-time"></p>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="stat-box">
                    <h4>总销售额（美元）</h4>
                    <p id="total-sales"></p>
                </div>
            </div>
        </div>

        <div class="row feedback-stats">
            <div class="col-sm-3">
                <div class="stat-box">
                    <h4>反馈总数</h4>
                    <p id="feedback-count"></p>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="stat-box">
                    <h4>高质量反馈</h4>
                    <p id="high-quality"></p>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="stat-box">
                    <h4>中质量反馈</h4>
                    <p id="medium-quality"></p>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="stat-box">
                    <h4>低质量反馈</h4>
                    <p id="low-quality"></p>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="row">
            <div class="col-sm-4">
                <h4>配送区域</h4>
                <div class="user-control">
                    <select id="delivery-area" class="form-control" onchange="dataManipulation()">
                        <option value="All">全部</option>
                        <option value="Boston">波士顿</option>
                        <option value="Cambridge">剑桥</option>
                        <option value="Somerville">萨默维尔</option>
                    </select>
                </div>
            </div>
            <div class="col-sm-4">
                <h4>订单类型</h4>
                <div class="user-control">
                    <select id="order-type" class="form-control" onchange="dataManipulation()">
                        <option value="All">全部</option>
                        <option value="web">网络</option>
                        <option value="phone">电话</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Chart Container -->
        <div class="row">
            <div class="col-sm-12">
                <div id="chart-area"></div>
            </div>
        </div>

        <!-- Completed: Load JS libraries: jQuery, bootstrap, D3, D3 Tooltips -->
        <script src="js/jquery.min.js"></script>
        <script src="js/bootstrap.min.js"></script>
        <script src="js/d3.min.js"></script>
        <script src="js/d3-tip.js"></script>

        <!-- Completed: Data loading, bar chart rendering -->
        <script src="js/delivery-data.js"></script>
        <script src="js/feedback-data.js"></script>
        <script src="js/barchart.js"></script>

        <!-- ****** 下方的文件是你需要完善的内容 TODO: FILTER DATA, DISPLAY BAR CHART & KEY FIGURES ****** -->
        <script src="js/main.js"></script>

</body>

</html>
