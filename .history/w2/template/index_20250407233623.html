<!DOCTYPE html>
<html>
<head>
    <title>PizzaWorld Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <!-- 筛选控件 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <select id="area-select" class="form-control">
                    <option value="All">All Areas</option>
                    <option>Boston</option>
                    <option>Cambridge</option>
                    <option>Somerville</option>
                </select>
            </div>
            <div class="col-md-6">
                <select id="order-type-select" class="form-control">
                    <option value="All">All Order Types</option>
                    <option>web</option>
                    <option>phone</option>
                </select>
            </div>
        </div>

        <!-- 数据摘要 -->
        <div id="summary" class="mb-4">
            <h2 class="mb-3">数据摘要</h2>
            <div class="row">
                <div class="col-md-4">
                    <p>披萨外送次数: <span id="delivery-count">0</span></p>
                    <p>所有外送披萨数量: <span id="total-pizzas">0</span></p>
                    <p>平均外送时间: <span id="avg-delivery-time">0</span> 分钟</p>
                </div>
                <div class="col-md-4">
                    <p>总销售额: $<span id="total-sales">0</span></p>
                    <p>反馈条目数量: <span id="feedback-count">0</span></p>
                </div>
                <div class="col-md-4">
                    <p>质量反馈分布:</p>
                    <ul>
                        <li>低: <span id="quality-low">0</span></li>
                        <li>中: <span id="quality-medium">0</span></li>
                        <li>高: <span id="quality-high">0</span></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 图表容器 -->
        <div id="chart-area"></div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
