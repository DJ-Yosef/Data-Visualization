<!-- player.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球员详情 - 足球数据系统</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="player-container">
        <a href="dashboard.html" class="back-btn">&larr; 返回</a>

        <!-- 头部信息卡 -->
        <div class="player-card">
            <div class="player-basic">
                <img src="" class="player-avatar" id="player-img">
                <div class="basic-info">
                    <h1 id="player-name"></h1>
                    <div class="meta-grid">
                        <div class="meta-item">
                            <label>位置</label>
                            <span id="player-pos"></span>
                        </div>
                        <div class="meta-item">
                            <label>年龄</label>
                            <span id="player-age"></span>
                        </div>
                        <div class="meta-item">
                            <label>身高</label>
                            <span id="player-height"></span>
                        </div>
                        <div class="meta-item">
                            <label>球队</label>
                            <span id="player-team"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 核心指标 -->
            <div class="core-stats">
                <div class="stat">
                    <div class="stat-value" id="gls90"></div>
                    <div class="stat-label">每90进球</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="xG"></div>
                    <div class="stat-label">预期进球</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="prgC"></div>
                    <div class="stat-label">推进带球</div>
                </div>
            </div>
        </div>

        <!-- 雷达图 -->
        <div class="radar-section">
            <h2>能力雷达图</h2>
            <div id="radar-chart"></div>
        </div>

        <!-- 数据表格 -->
        <div class="stats-tabs">
            <div class="tab-nav">
                <button class="tab-active" data-tab="basic">基础数据</button>
                <button data-tab="attack">进攻表现</button>
                <button data-tab="progressive">推进能力</button>
            </div>

            <div class="tab-content" id="basic">
                <div class="stat-row">
                    <span>出场次数</span>
                    <span id="MP"></span>
                </div>
                <div class="stat-row">
                    <span>控球率</span>
                    <span id="Poss"></span>
                </div>
                <!-- 其他基础数据 -->
            </div>

            <div class="tab-content hidden" id="attack">
                <div class="stat-row">
                    <span>非点球进球</span>
                    <span id="G-PK"></span>
                </div>
                <!-- 其他进攻数据 -->
            </div>
        </div>
    </div>

    <script src="player.js"></script>
</body>
</html>
