<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界最高建筑可视化</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="main.css"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>世界最高建筑可视化</h1>
            <p class="subtitle">探索世界上最高的10座建筑。点击柱状图或建筑名称查看详细信息，包括高度、位置、楼层数、竣工年份和建筑图片。</p>
        </header>

        <div class="content">
            <div class="chart-container">
                <div id="chart"></div>
                <p class="instructions">点击柱状图或建筑名称查看详细信息</p>
            </div>

            <div class="detail-container">
                <div class="detail-header">
                    <h2 id="building-name">请选择一栋建筑</h2>
                    <p id="building-location">点击左侧柱状图查看详细信息</p>
                </div>

                <img id="building-image" class="building-image" src="" alt="建筑图片">

                <div class="building-info">
                    <table class="info-table">
                        <tr>
                            <td class="info-label">高度</td>
                            <td id="height-value" class="info-value">-</td>
                        </tr>
                        <tr>
                            <td class="info-label">城市</td>
                            <td id="city-value" class="info-value">-</td>
                        </tr>
                        <tr>
                            <td class="info-label">国家</td>
                            <td id="country-value" class="info-value">-</td>
                        </tr>
                        <tr>
                            <td class="info-label">楼层数</td>
                            <td id="floors-value" class="info-value">-</td>
                        </tr>
                        <tr>
                            <td class="info-label">竣工年份</td>
                            <td id="year-value" class="info-value">-</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>

        <footer>
            <p>数据来源: 世界高层建筑与都市人居学会 (CTBUH) | 可视化设计: D3.js</p>
            <p>注: 所有高度数据包括建筑尖顶，但不包括天线杆。数据更新至2023年。</p>
        </footer>
    </div>


</body>
</html>
